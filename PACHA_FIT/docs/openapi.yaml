openapi: 3.0.0
info:
  title: PachaFit
  version: 1.0.0
servers:
  - url: /api/v1
    description: Default Azure Functions prefix
paths:
  /profile/{userId}:
    put:
      tags:
        - User
      summary: Update user profile
      operationId: User_UpdateProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDtoOfString'
  /auth:
    post:
      tags:
        - Auth
      summary: User login
      operationId: Auth_Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDtoOfLoginResponse'
  /users:
    get:
      tags:
        - User
      summary: Get users by criteria
      operationId: User_GetUsers
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: userName
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDtoOfUserDto'
    post:
      tags:
        - Auth
      summary: User registration
      operationId: Auth_SignUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDtoOfString'
  /user/{userId}:
    put:
      tags:
        - User
      summary: Update user (Admin)
      operationId: User_UpdateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDtoOfString'
  /inventory/adjustment-reasons:
    get:
      tags:
        - Inventory
      summary: List all predefined adjustment reasons
      operationId: Inventory_GetAdjustmentReasons
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /inventory/units:
    get:
      tags:
        - Inventory
      summary: Get all active units of measure
      operationId: Inventory_GetUnits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDtoOfUnitOfMeasureGroupedDto'
  /inventory/units/convert:
    get:
      tags:
        - Inventory
      summary: Convert quantity between units
      operationId: Inventory_ConvertUnit
      parameters:
        - name: quantity
          in: query
          required: true
          schema:
            type: number
        - name: fromUnit
          in: query
          required: true
          schema:
            type: string
        - name: toUnit
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDtoOfDecimal'
  /inventory/products:
    post:
      tags:
        - Inventory
      summary: Create a new product
      operationId: Inventory_CreateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDtoOfProductResponse'
  /inventory/products/{sku}/deactivate:
    post:
      tags:
        - Inventory
      summary: Deactivate a product
      operationId: Inventory_DeactivateProduct
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDtoOfBoolean'
  /inventory/dispatch:
    post:
      tags:
        - Inventory
      summary: Dispatch stock
      operationId: Inventory_DispatchStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchStockRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDtoOfString'
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        token:
          type: string
        roleName:
          type: string
          nullable: true
    NewUserRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
    UpdateProfileRequest:
      type: object
      required:
        - email
        - fullName
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
        identificationType:
          type: string
          nullable: true
        identificationNumber:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
    UpdateUserRequest:
      type: object
      properties:
        roleId:
          type: integer
          nullable: true
        isActive:
          type: boolean
          nullable: true
    UserDto:
      type: object
      properties:
        userId:
          type: integer
        email:
          type: string
        fullName:
          type: string
          nullable: true
        roleId:
          type: integer
          nullable: true
        isActive:
          type: boolean
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        identificationType:
          type: string
          nullable: true
        identificationNumber:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
    ProductCreateRequest:
      type: object
      required:
        - name
        - sku
      properties:
        name:
          type: string
        sku:
          type: string
        categoryId:
          type: integer
          nullable: true
        costPrice:
          type: number
        salePrice:
          type: number
        ivaPercentage:
          type: integer
        isWeightBased:
          type: boolean
        initialStock:
          type: number
        initialUnitAbbreviation:
          type: string
        specs:
          type: array
          items:
            $ref: '#/components/schemas/ProductSpec'
          nullable: true
        composition:
          type: array
          items:
            $ref: '#/components/schemas/ProductCompositionRequest'
          nullable: true
    ProductResponse:
      type: object
      properties:
        productId:
          type: integer
        name:
          type: string
        sku:
          type: string
        stockQty:
          type: number
        ivaPercentage:
          type: integer
        isWeightBased:
          type: boolean
        specsJson:
          type: string
          nullable: true
        composition:
          type: array
          items:
            $ref: '#/components/schemas/ProductCompositionResponse'
          nullable: true
    ProductSpec:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
    ProductCompositionRequest:
      type: object
      properties:
        baseProductSku:
          type: string
        quantity:
          type: number
        unitAbbreviation:
          type: string
    ProductCompositionResponse:
      type: object
      properties:
        baseProductName:
          type: string
        quantity:
          type: number
        unitAbbreviation:
          type: string
    UnitOfMeasureGroupedDto:
      type: object
      properties:
        massUnits:
          type: array
          items:
            $ref: '#/components/schemas/UnitOfMeasureItemDto'
        volumeUnits:
          type: array
          items:
            $ref: '#/components/schemas/UnitOfMeasureItemDto'
        discreteUnits:
          type: array
          items:
            $ref: '#/components/schemas/UnitOfMeasureItemDto'
    UnitOfMeasureItemDto:
      type: object
      properties:
        abbreviation:
          type: string
        name:
          type: string
    DispatchStockRequest:
      type: object
      required:
        - productId
        - quantity
        - unitAbbreviation
      properties:
        productId:
          type: integer
        quantity:
          type: number
        unitAbbreviation:
          type: string
    ResultDtoOfString:
      type: object
      properties:
        data:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
    ResultDtoOfLoginResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/LoginResponse'
        error:
          type: string
          nullable: true
    ResultDtoOfUserDto:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserDto'
        error:
          type: string
          nullable: true
    ResultDtoOfUnitOfMeasureGroupedDto:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UnitOfMeasureGroupedDto'
        error:
          type: string
          nullable: true
    ResultDtoOfDecimal:
      type: object
      properties:
        data:
          type: number
        error:
          type: string
          nullable: true
    ResultDtoOfProductResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ProductResponse'
        error:
          type: string
          nullable: true
    ResultDtoOfBoolean:
      type: object
      properties:
        data:
          type: boolean
        error:
          type: string
          nullable: true
    ErrorType:
      type: string
      enum:
        - Success
        - NotFound
        - Unauthorized
        - Validation
        - Conflict
        - Unexpected
        - BadRequest
